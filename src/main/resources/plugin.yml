name: DeadRinger
version: '1.0.0.0'
main: io.github.derec4.deadRinger.DeadRinger
api-version: '1.18'
prefix: DerexXD
authors: [ DerexXD ]
description: Admin command plugin made for KiingTong
website: https://www.youtube.com/@Kiingtong

commands:
  veil:
    description: Toggle invincibility protection for yourself or others
    usage: /veil <on|off|toggle|list> [player]
    aliases: [v]
    permission: veil.use

permissions:
  veil.use:
    description: Allows player to toggle their own veil protection
    default: true
  veil.admin:
    description: Allows player to target others and use /veil list
    default: op
  kiingtong.invincible:
    description: Internal permission to track who is invincible
    default: op
